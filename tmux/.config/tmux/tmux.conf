# tmux configuration.
#
# tmux splits one terminal window into panes and windows, and keeps them alive
# even when the terminal is closed.
#
# Every shortcut below is typed as:  prefix, release, then the key.
# The prefix here is Ctrl+Space.
#
# Reload after editing:  prefix + r

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# Ctrl+b is awkward to reach. Ctrl+a is the common alternative but collides with
# "jump to start of line" in the shell, so Ctrl+Space it is.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# General behaviour
# ---------------------------------------------------------------------------

set -g mouse on                # click panes, drag borders, scroll with the wheel
set -g history-limit 50000     # scrollback lines per pane
set -sg escape-time 10         # don't misread <Esc> in Neovim as an escape sequence
set -g focus-events on         # let Neovim notice focus changes (autoread etc.)
set -g detach-on-destroy off   # closing a session switches to another instead of quitting

# Windows and panes count from 1 - matches the number row on the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on     # no gaps in the numbering after closing a window

# True colour. Without these two lines Neovim's theme looks washed out inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*:RGB"

# Longer, more useful window titles.
set -g set-titles on
set -g set-titles-string "#S / #W"

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

# Reload this file.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits: | is visually a vertical divider, - a horizontal one.
# -c "#{pane_current_path}" opens the new pane in the same directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the current directory too.
bind c new-window -c "#{pane_current_path}"

# Resize panes, repeatable (hold the key after the prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-tmux-navigator (see plugins below) binds Ctrl+h/j/k/l without a prefix so
# you can move between Neovim splits and tmux panes with the same keys. That
# steals Ctrl+l, which normally clears the screen - this gives it back.
bind C-l send-keys 'C-l'

# ---------------------------------------------------------------------------
# Copy mode (vi keys)
# ---------------------------------------------------------------------------
# prefix + [   enter copy mode, then move around with hjkl
#     v        start selection
#     y        copy and leave
#     q        leave
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Plugins (tpm)
# ---------------------------------------------------------------------------
# prefix + I   install plugins
# prefix + U   update plugins
#
# Plugins live outside ~/.config/tmux on purpose: stow makes that directory a
# symlink into this repo, so the default location would clone plugin sources
# straight into our git history.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # uncontroversial defaults
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl+h/j/k/l across nvim + tmux
set -g @plugin 'catppuccin/tmux'                 # theme

# Catppuccin appearance. Note the spelling: this plugin reads "flavor", not
# "flavour" - the British spelling is silently ignored and you get the default.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# Install tpm itself on first run, so a fresh machine only needs ./bootstrap.sh.
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

run '~/.local/share/tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Status line content
# ---------------------------------------------------------------------------
# This block MUST come after tpm has run: the @catppuccin_status_* variables
# below are defined by the catppuccin plugin, so setting them earlier would
# leave the status line at tmux's plain green default.
#
# Left side stays empty; the window list sits there. Right side shows the
# current directory, the session name and the time.
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
